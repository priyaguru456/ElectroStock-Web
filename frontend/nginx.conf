server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing: serve index.html for unknown paths
    # instead of nginx's default 404, so refreshing on e.g. /products works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
